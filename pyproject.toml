[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-transfer-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
vision = ["torchvision>=0.20", "timm>=1.0", "Pillow>=10", "tqdm>=4"]
analysis = ["pandas>=2", "scipy>=1.12", "matplotlib>=3.8", "seaborn>=0.13"]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbclient>=0.10", "nbformat>=5"]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["rl_transfer*"]
