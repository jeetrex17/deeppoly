<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="365" viewBox="0 0 1080 365" role="img"><title>Behavior-cloning competence diagnostics</title><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#566176}.label{font-size:14px}.value{font-size:13px;font-weight:600}.group{font-size:16px;font-weight:700}.axis{font-size:12px;fill:#68748a}</style><rect width="100%" height="100%" fill="#ffffff"/><text class="title" x="40" y="45">Behavior-cloning competence diagnostics</text><text class="subtitle" x="40" y="74">Exact 96-action prediction remained near the majority baseline</text><line x1="310.0" y1="115" x2="310.0" y2="315" stroke="#e4e8ef"/><text class="axis" x="310.0" y="335" text-anchor="middle">0.000</text><line x1="448.0" y1="115" x2="448.0" y2="315" stroke="#e4e8ef"/><text class="axis" x="448.0" y="335" text-anchor="middle">0.010</text><line x1="586.0" y1="115" x2="586.0" y2="315" stroke="#e4e8ef"/><text class="axis" x="586.0" y="335" text-anchor="middle">0.020</text><line x1="724.0" y1="115" x2="724.0" y2="315" stroke="#e4e8ef"/><text class="axis" x="724.0" y="335" text-anchor="middle">0.030</text><line x1="862.0" y1="115" x2="862.0" y2="315" stroke="#e4e8ef"/><text class="axis" x="862.0" y="335" text-anchor="middle">0.040</text><line x1="1000.0" y1="115" x2="1000.0" y2="315" stroke="#e4e8ef"/><text class="axis" x="1000.0" y="335" text-anchor="middle">0.050</text><text class="group" x="40" y="141">Mean across policy runs</text><text class="label" x="298" y="165" text-anchor="end">Training accuracy</text><rect x="310" y="149" width="412.57" height="22" rx="4" fill="#2563eb"/><text class="value" x="730.57" y="165">0.0299</text><text class="label" x="298" y="199" text-anchor="end">Validation accuracy</text><rect x="310" y="183" width="391.46" height="22" rx="4" fill="#0f9f7f"/><text class="value" x="709.46" y="199">0.0284</text><text class="label" x="298" y="233" text-anchor="end">Validation majority</text><rect x="310" y="217" width="406.93" height="22" rx="4" fill="#f59e0b"/><text class="value" x="724.93" y="233">0.0295</text><text class="label" x="298" y="267" text-anchor="end">Uniform chance</text><rect x="310" y="251" width="143.75" height="22" rx="4" fill="#94a3b8"/><text class="value" x="461.75" y="267">0.0104</text><text class="axis" x="655.0" y="357" text-anchor="middle">Action prediction accuracy</text></svg>
