<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title description"><title id="title">Learned policy gain versus score greedy</title><desc id="description">Negative values favor score greedy. Each fold is the macro mean over four matched source conditions.</desc><style>text{font-family:Inter,system-ui,sans-serif;fill:#17324d}.title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#526579}.label{font-size:13px;font-weight:600}.value{font-size:12px;font-weight:600}.tick{font-size:11px;fill:#60758a}.legend{font-size:12px}</style><rect width="1120" height="390" fill="#fbfcfe"/><text class="title" x="32" y="38">Learned policy gain versus score greedy</text><text class="subtitle" x="32" y="62">Negative values favor score greedy. Each fold is the macro mean over four matched source conditions.</text><rect x="32" y="76" width="12" height="12" rx="2" fill="#2474b5"/><text class="legend" x="50" y="87">ASR gain</text><rect x="112" y="76" width="12" height="12" rx="2" fill="#e67e22"/><text class="legend" x="130" y="87">AUC gain</text><line x1="360.00" y1="96" x2="360.00" y2="342" stroke="#d8e0e8" stroke-width="1"/><text class="tick" x="360.00" y="364" text-anchor="middle">-0.89%</text><line x1="525.00" y1="96" x2="525.00" y2="342" stroke="#d8e0e8" stroke-width="1"/><text class="tick" x="525.00" y="364" text-anchor="middle">-0.65%</text><line x1="690.00" y1="96" x2="690.00" y2="342" stroke="#d8e0e8" stroke-width="1"/><text class="tick" x="690.00" y="364" text-anchor="middle">-0.41%</text><line x1="855.00" y1="96" x2="855.00" y2="342" stroke="#d8e0e8" stroke-width="1"/><text class="tick" x="855.00" y="364" text-anchor="middle">-0.17%</text><line x1="1020.00" y1="96" x2="1020.00" y2="342" stroke="#d8e0e8" stroke-width="1"/><text class="tick" x="1020.00" y="364" text-anchor="middle">0.07%</text><line x1="974.48" y1="96" x2="974.48" y2="342" stroke="#17324d" stroke-width="1.5"/><text class="label" x="346